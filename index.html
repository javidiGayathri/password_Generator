<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cipher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card" id="app">

    <h1 class="title">Keystone</h1>
    <p class="subtitle">Build a password piece by piece.</p>

    <div class="output-box">
      <code id="outputField">— generate to preview —</code>
      <button id="copyAction" class="copy-btn" type="button" aria-label="Copy password">Copy</button>
    </div>
    <p id="copyMsg" class="copy-msg"></p>

    <div class="meter-wrap">
      <div class="meter-track">
        <div id="meterBar" class="meter-bar"></div>
      </div>
      <span id="meterText" class="meter-text">No password yet</span>
    </div>

    <div class="field">
      <div class="field-label">
        <label for="lenInput">Length</label>
        <output id="lenDisplay" for="lenInput">14</output>
      </div>
      <input type="range" id="lenInput" min="6" max="30" value="14" step="1" />
    </div>

    <fieldset class="checks">
      <legend>Include</legend>

      <label class="check-row">
        <input type="checkbox" id="chkUpper" checked />
        <span class="box"></span>
        <span class="check-label">Uppercase (A–Z)</span>
      </label>

      <label class="check-row">
        <input type="checkbox" id="chkLower" checked />
        <span class="box"></span>
        <span class="check-label">Lowercase (a–z)</span>
      </label>

      <label class="check-row">
        <input type="checkbox" id="chkDigits" checked />
        <span class="box"></span>
        <span class="check-label">Digits (0–9)</span>
      </label>

      <label class="check-row">
        <input type="checkbox" id="chkSymbols" />
        <span class="box"></span>
        <span class="check-label">Symbols (!@#...)</span>
      </label>
    </fieldset>

    <p id="warnMsg" class="warn-msg" role="alert"></p>

    <button id="buildAction" class="build-btn" type="button">Generate password</button>

  </main>

<script src="script.js"></script>
</body>
</html>
