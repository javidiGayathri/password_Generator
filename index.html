<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cipher — Password Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="grain"></div>

  <main class="vault">

    <header class="vault-header">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">Cipher</span>
      </div>
      <p class="tagline">Turn a dial, cut a key.</p>
    </header>

    <section class="readout" aria-label="Generated password display">
      <div class="readout-slot">
        <span id="passwordText" class="readout-text">turn the dial to begin</span>
        <button id="copyBtn" class="icon-btn" title="Copy to clipboard" aria-label="Copy password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="12" height="12" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <span id="copyToast" class="copy-toast">copied</span>
    </section>

    <section class="gauge-row">
      <div class="gauge" aria-hidden="true">
        <svg viewBox="0 0 140 90" class="gauge-svg">
          <path d="M10 80 A60 60 0 0 1 130 80" fill="none" stroke="#2A3644" stroke-width="10" stroke-linecap="round"/>
          <path id="gaugeArc" d="M10 80 A60 60 0 0 1 130 80" fill="none" stroke="#C9A227" stroke-width="10" stroke-linecap="round" stroke-dasharray="188" stroke-dashoffset="188"/>
          <line id="gaugeNeedle" x1="70" y1="80" x2="70" y2="30" stroke="#F2E9D8" stroke-width="2.5" stroke-linecap="round" style="transform-origin: 70px 80px; transform: rotate(-90deg); transition: transform 0.4s cubic-bezier(.4,1.6,.6,1);"/>
          <circle cx="70" cy="80" r="4" fill="#F2E9D8"/>
        </svg>
        <span id="gaugeLabel" class="gauge-label">—</span>
      </div>

      <div class="length-control">
        <div class="length-control-top">
          <label for="lengthSlider">Key length</label>
          <span id="lengthValue" class="length-value">16</span>
        </div>
        <input type="range" id="lengthSlider" min="4" max="32" value="16" />
        <div class="length-ticks" aria-hidden="true">
          <span>4</span><span>32</span>
        </div>
      </div>
    </section>

    <section class="tumblers" aria-label="Character options">
      <button type="button" class="tumbler active" data-option="upper" role="switch" aria-checked="true">
        <span class="tumbler-glyph">A</span>
        <span class="tumbler-name">Uppercase</span>
        <span class="tumbler-switch"><span class="tumbler-knob"></span></span>
      </button>

      <button type="button" class="tumbler active" data-option="lower" role="switch" aria-checked="true">
        <span class="tumbler-glyph">a</span>
        <span class="tumbler-name">Lowercase</span>
        <span class="tumbler-switch"><span class="tumbler-knob"></span></span>
      </button>

      <button type="button" class="tumbler active" data-option="numbers" role="switch" aria-checked="true">
        <span class="tumbler-glyph">4</span>
        <span class="tumbler-name">Numbers</span>
        <span class="tumbler-switch"><span class="tumbler-knob"></span></span>
      </button>

      <button type="button" class="tumbler" data-option="symbols" role="switch" aria-checked="false">
        <span class="tumbler-glyph">%</span>
        <span class="tumbler-name">Symbols</span>
        <span class="tumbler-switch"><span class="tumbler-knob"></span></span>
      </button>
    </section>

    <p id="errorText" class="error-text" role="alert"></p>

    <button id="generateBtn" class="cut-key-btn">
      <span>Cut a new key</span>
    </button>

    <footer class="vault-footer">
      <span>Passwords are generated locally in your browser. Nothing is stored or sent anywhere.</span>
    </footer>

  </main>

<script src="script.js"></script>
</body>
</html>
